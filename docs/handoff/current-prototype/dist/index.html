<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101923"><meta name="description" content="ひとつのボタンから、画面の中に自分のPC環境を作るインクリメンタルゲーム。"><title>UIアルケミスト</title><link rel="preload" href="./assets/wallpaper-coast.png" as="image"><link rel="stylesheet" href="./system.css"></head><body>
<main id="computer" aria-label="作業環境"></main>
<div id="preview-controls" hidden><span>プレビュー</span><select id="preview-select" aria-label="段階を選ぶ"></select><button id="preview-next">次へ →</button><a href="./">本編</a></div>
<dialog id="settings"><div class="dialog-head"><span>設定</span><button data-act="close-dialog" aria-label="閉じる">×</button></div><div class="dialog-content"><h2>UIアルケミスト</h2><div class="setting-row"><label for="sound-setting">効果音</label><input type="checkbox" id="sound-setting"></div><div class="setting-row"><label for="auto-setting">カーソルを自動で追加</label><input type="checkbox" id="auto-setting"></div><div class="setting-row"><span>画面表示</span><button data-act="fullscreen" class="soft-button">全画面にする</button></div><div class="setting-row"><span>進行データ</span><button id="export-save" class="soft-button">書き出す</button><button id="import-save" class="soft-button">読み込む</button><input type="file" accept="application/json" id="save-file" hidden></div><div class="setting-row"><span>保存</span><span id="save-status">自動保存</span></div><div class="setting-row"><button id="reset" class="text-button danger">最初から作り直す</button></div><p>進行はこのブラウザに保存されます。不在時の生産は最大8時間です。</p></div></dialog>
<dialog id="file-viewer"><div class="dialog-head"><span id="file-title"></span><button data-act="close-dialog" aria-label="閉じる">×</button></div><div id="file-content" class="dialog-content"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script src="./economy.js"></script><script src="./screens.js"></script><script src="./computer.js"></script></body></html>
