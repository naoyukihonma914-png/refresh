<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>UI・アルケミスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: era 0 = one centered column of raw, unstyled text. Era 1+ = HUD bar over [stage | inspector panel].
   The page deliberately starts as an unstyled HTML document; crafted components switch the tokens on. */
:root{
  --bg:#ffffff; --bg2:#ffffff; --fg:#000000; --muted:#444444; --line:#000000;
  --accent:#0000ee; --accent2:#551a8b; --hot:#cc0000; --good:#006600; --panel:#ffffff;
  --gel-top:#ffffff; --gel-bot:#ffffff; --gel-edge:#000000; --gel-text:#000000;
  --gridc:rgba(0,0,0,0);
  --font-body:"Times New Roman","Hiragino Mincho ProN","Yu Mincho","MS PMincho",serif;
  --font-display:var(--font-body); --font-num:var(--font-body);
  color-scheme:light;
}
body.has-color{
  --bg:#0d2140; --bg2:#13305a; --fg:#e8eefa; --muted:#93a8c9; --line:#2f5185;
  --accent:#ffb23e; --accent2:#62d6ff; --hot:#ff5d73; --good:#7cf2b0; --panel:#0f2649;
  --gel-top:#ffcf7a; --gel-bot:#ff9a1a; --gel-edge:#a9560a; --gel-text:#3b1c00;
  --gridc:rgba(98,214,255,.07);
  color-scheme:dark;
}
body.has-font{
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  --font-display:"DotGothic16","MS Gothic","Osaka-Mono",monospace;
  --font-num:"DotGothic16",ui-monospace,monospace;
}
body.era-2{ --bg:#08152b; --bg2:#0f2448; --panel:rgba(12,29,58,.94); --line:#284a7c; }
body.era-3{ --bg:#05070e; --bg2:#0d1428; --panel:rgba(10,15,30,.94); --line:#26344f; --muted:#8a97b5; }

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
#app{height:100%}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}

/* ---------- ERA 0: raw text ---------- */
#e0{position:relative;height:100%;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding-block:32px;padding-inline:16px;box-sizing:border-box}
#e0.out{transition:transform .6s cubic-bezier(.7,0,.3,1),opacity .6s;transform:scale(.15);opacity:0}
.e0-count{font-size:18px}
body.has-font .e0-count{font-family:var(--font-num);font-size:34px;letter-spacing:.02em}
body.has-color .e0-count{color:var(--accent)}
.e0-count small{font-size:.5em;color:var(--muted);margin-left:.4em}
.e0-stage{position:relative;width:min(440px,100%);height:270px;display:grid;place-items:center}
#gen{all:unset;cursor:pointer;color:#0000ee;text-decoration:underline;font-size:18px;position:relative;z-index:2;user-select:none}
body.has-border #gen{text-decoration:none;color:var(--fg);border:1px solid var(--line);padding:12px 22px;background:var(--bg)}
body.has-color #gen{background:linear-gradient(var(--gel-top),var(--gel-bot));color:var(--gel-text);border-color:#ffe0a6;border-radius:12px;box-shadow:0 5px 0 var(--gel-edge),0 0 34px rgba(255,178,62,.35)}
body.has-font #gen{font-family:var(--font-display);font-size:20px;letter-spacing:.04em}
body.has-anim #gen{transition:transform .07s,box-shadow .07s}
body.has-anim #gen.press{transform:translateY(4px);box-shadow:0 1px 0 var(--gel-edge),0 0 44px rgba(255,178,62,.6)}
.e0-heat{display:flex;align-items:center;gap:10px;font-family:var(--font-num);color:var(--muted)}
.e0-heat i,.hud-heat i{display:block;width:160px;height:8px;border-radius:4px;background:rgba(255,255,255,.08);border:1px solid var(--line);overflow:hidden}
.e0-heat b,.hud-heat b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--hot))}
.e0-shop{width:min(660px,100%);display:flex;flex-direction:column;gap:6px}
.e0-item{display:grid;grid-template-columns:auto 1fr auto;column-gap:10px;align-items:baseline}
.e0-item .e0-act{all:unset;cursor:pointer;color:#0000ee;text-decoration:underline}
.e0-item.no .e0-act{color:#777;cursor:default;text-decoration:none}
.e0-name{white-space:nowrap;overflow:hidden}
.e0-name::after{content:" ................................................................................";color:var(--muted)}
.e0-cost{white-space:nowrap;font-variant-numeric:tabular-nums}
.e0-desc{grid-column:2/4;font-size:13px;color:var(--muted)}
body.has-border .e0-item{border:1px solid var(--line);padding:8px 10px}
body.has-border .e0-item .e0-act{text-decoration:none;border:1px solid var(--line);padding:2px 8px;color:var(--fg)}
body.has-color .e0-item{background:var(--panel);border-radius:8px}
body.has-color .e0-item .e0-act{background:var(--accent);color:var(--gel-text);border-color:var(--accent);border-radius:6px}
body.has-color .e0-item.no .e0-act{background:transparent;color:var(--muted);border-color:var(--line)}
body.has-color .e0-name::after{color:rgba(147,168,201,.35)}
body.has-font .e0-act{font-family:var(--font-display)}
body.has-font .e0-cost{font-family:var(--font-num)}
.e0-log{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px;max-width:calc(100% - 32px);pointer-events:none}
.e0-foot{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));font-size:11px;color:var(--muted)}
body.has-anim .e0-item.new{animation:pop .5s}
@keyframes pop{0%{transform:translateY(8px);opacity:0}100%{transform:none;opacity:1}}

/* cursors */
.curs{position:absolute;left:50%;top:50%;width:0;height:0;z-index:3;pointer-events:none}
body.has-anim .curs.spin{animation:orbit 40s linear infinite}
@keyframes orbit{to{transform:rotate(360deg)}}
.cur{position:absolute;width:15px;height:20px;margin:-2px 0 0 -2px;transform-origin:2px 2px}
.cur svg{width:15px;height:20px;display:block;overflow:visible}
.cur path{fill:#fff;stroke:#000;stroke-width:1.4;stroke-linejoin:round}
body.has-color .cur path{fill:var(--accent2);stroke:#062033}
body.has-anim .cur.tap svg{animation:tap .22s}
@keyframes tap{50%{transform:translate(3px,3px) scale(.85)}}
.cur-more{position:absolute;left:0;top:0;transform:translate(-50%,0);font-size:11px;color:var(--muted);white-space:nowrap;font-family:var(--font-num)}

.float{position:fixed;pointer-events:none;z-index:50;font-family:var(--font-num);font-size:16px;color:var(--accent);text-shadow:0 0 8px rgba(255,178,62,.6);animation:flt .8s ease-out forwards;white-space:nowrap}
.float.big{font-size:22px;color:var(--good)}
@keyframes flt{0%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,-46px);opacity:0}}

/* ---------- SHELL (era 1+) ---------- */
#shell{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,380px);grid-template-rows:auto minmax(0,1fr);height:100%}
#shell.in{animation:winopen .55s cubic-bezier(.2,.9,.2,1)}
@keyframes winopen{0%{transform:scale(.3);opacity:0}100%{transform:none;opacity:1}}
#hud{grid-column:1/3;display:flex;align-items:center;gap:22px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--bg)}
.hud-px{display:flex;align-items:baseline;gap:6px;font-family:var(--font-num)}
.hud-px b{font-size:30px;font-weight:400;color:var(--accent);font-variant-numeric:tabular-nums;min-width:5ch}
.hud-px span{color:var(--muted)}
.hud-rate{font-family:var(--font-num);color:var(--fg);font-size:16px}
.hud-rate span{color:var(--accent2)}
.hud-heat{display:flex;align-items:center;gap:8px;font-family:var(--font-num);color:var(--muted);font-size:13px}
.hud-heat i{width:110px}
.hud-heat em{font-style:normal;min-width:4.5ch;color:var(--fg)}
.hud-heat.fz em{color:var(--good)}
.hud-era{font-family:var(--font-display);color:var(--muted);font-size:13px;letter-spacing:.08em;margin-left:auto}
.hud-btns{display:flex;gap:8px}
.hbtn{background:transparent;border:1px solid var(--line);color:var(--fg);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px}
.hbtn:hover{border-color:var(--accent2)}
.hbtn.ref{border-color:var(--accent);color:var(--accent);font-family:var(--font-display)}
.hbtn.ref.glow{box-shadow:0 0 16px rgba(255,178,62,.35)}

#stage{position:relative;overflow:hidden;background-color:var(--bg);background-image:linear-gradient(var(--gridc) 1px,transparent 1px),linear-gradient(90deg,var(--gridc) 1px,transparent 1px);background-size:28px 28px;min-height:0}
body.era-2 #stage,body.era-3 #stage{background-image:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.hint{position:absolute;left:16px;bottom:12px;right:16px;font-size:12px;color:var(--muted);pointer-events:none;line-height:1.6}
.hint kbd{font-family:var(--font-num);border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--fg)}

#panel{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line);background:var(--panel)}
.psec{padding:14px 16px;border-bottom:1px solid var(--line)}
.psec h3{margin:0 0 10px;font-family:var(--font-display);font-weight:400;font-size:13px;letter-spacing:.12em;color:var(--muted)}
#shop{flex:1;overflow:auto;min-height:120px}
#logbox{height:132px;overflow:hidden;font-size:12px;color:var(--muted);display:flex;flex-direction:column;justify-content:flex-end;gap:3px;border-bottom:0}
#logbox .good{color:var(--good)} #logbox .bad{color:var(--hot)} #logbox .sys{color:var(--accent2)}

.grp{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.item{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;transition:border-color .12s,transform .08s}
.item:hover{border-color:var(--accent2)}
.item:active{transform:translateY(1px)}
.item.no{opacity:.5;cursor:default}
.item.no:hover{border-color:var(--line)}
.item.new{box-shadow:0 0 0 1px var(--accent),0 0 18px rgba(255,178,62,.25)}
.item.on{border-color:var(--accent)}
.item svg{width:30px;height:30px}
.item path{fill:none;stroke:var(--tc,var(--accent2));stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.it-top{display:flex;gap:8px;align-items:baseline}
.it-name{font-weight:700;font-size:14px}
.it-meta{font-family:var(--font-num);font-size:12px;color:var(--muted)}
.it-desc{font-size:12px;color:var(--muted);line-height:1.45;margin-top:2px}
.it-cost{font-family:var(--font-num);font-size:14px;color:var(--accent);white-space:nowrap;text-align:right}
.item.no .it-cost{color:var(--muted)}
.item.shift .it-name{color:var(--accent)}

#sel .selhead{display:flex;gap:10px;align-items:center}
#sel .selhead svg{width:34px;height:34px}
#sel .selhead path{fill:none;stroke:var(--tc);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#sel .selname{font-weight:700}
#sel .selout{font-family:var(--font-num);color:var(--accent);font-size:20px}
.facts{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:12px;color:var(--muted);margin:10px 0}
.facts b{font-weight:400;font-family:var(--font-num);color:var(--fg);text-align:right}
.facts .up{color:var(--good)} .facts .dn{color:var(--hot)}
.selbtns{display:flex;gap:8px;flex-wrap:wrap}
.sbtn{background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;font-size:13px}
.sbtn:hover{border-color:var(--accent2)}
.sbtn.pri{border-color:var(--accent);color:var(--accent)}
.sbtn:disabled{opacity:.45;cursor:default}
.selhint{font-size:12px;color:var(--muted);line-height:1.7}
.selhint kbd{font-family:var(--font-num);border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--fg)}

.strow{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12px;margin-bottom:5px}
.strow svg{width:18px;height:18px} .strow path{fill:none;stroke:var(--tc);stroke-width:1.8}
.strow .bar{grid-column:2/4;height:3px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden}
.strow .bar i{display:block;height:100%;background:var(--tc)}
.strow b{font-weight:400;font-family:var(--font-num)}

/* ---------- ERA 1 window ---------- */
.desk{position:absolute;inset:0;display:grid;place-items:center;padding-bottom:30px}
.win{border:1px solid var(--line);background:var(--bg);border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.45),0 0 0 4px rgba(98,214,255,.04)}
.win.creak{animation:creak 2.6s infinite}
@keyframes creak{0%,90%,100%{transform:none}92%{transform:translate(1px,-1px) rotate(.15deg)}94%{transform:translate(-1px,1px) rotate(-.15deg)}96%{transform:translate(1px,0)}}
.win-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 12px;border-bottom:1px solid var(--line);font-family:var(--font-display);font-size:13px}
.win-bar .win-name{color:var(--fg);letter-spacing:.06em}
.win-bar .win-info{color:var(--muted)}
.win-bar .win-info.full{color:var(--hot)}
.grid{position:relative;margin:16px}
.glinks{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.glinks line{stroke:var(--line);stroke-width:3}
.glinks line.act{stroke:var(--accent);stroke-dasharray:4 5;animation:dash 0.8s linear infinite}
.glinks line.loop{stroke:var(--accent2)}
@keyframes dash{to{stroke-dashoffset:-18}}
.slot{position:absolute;border:1px dashed var(--line);border-radius:8px;box-sizing:border-box;opacity:.55}
.slot.can{opacity:1;border-color:var(--accent);background:rgba(255,178,62,.07);cursor:pointer;animation:breathe 1.2s infinite}
@keyframes breathe{50%{background:rgba(255,178,62,.16)}}
.tile{position:absolute;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;background:var(--bg2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;transition:border-color .12s,transform .1s;user-select:none;text-align:center;padding:4px}
.tile:hover{border-color:var(--tc)}
.tile svg{width:42%;height:42%;max-width:40px}
.tile path{fill:none;stroke:var(--tc);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tile .tn{font-size:11px;line-height:1.1}
.tile .tv{font-family:var(--font-num);font-size:11px;color:var(--muted)}
.tile.sel{border-color:#fff;box-shadow:0 0 0 2px var(--tc)}
.tile.loop{box-shadow:inset 0 0 0 2px rgba(98,214,255,.5)}
.tile.boost{background:linear-gradient(180deg,rgba(255,178,62,.12),var(--bg2))}
.tile.pop{animation:tpop .35s}
@keyframes tpop{0%{transform:scale(.6)}70%{transform:scale(1.06)}100%{transform:none}}
.tile.core{background:linear-gradient(var(--gel-top),var(--gel-bot));border-color:#ffe0a6;color:var(--gel-text);box-shadow:0 4px 0 var(--gel-edge)}
.tile.core path{stroke:var(--gel-text)}
.tile.core .tv{color:var(--gel-text);opacity:.8}
.tile.core.press{transform:translateY(3px);box-shadow:0 1px 0 var(--gel-edge)}
.tile.moving{opacity:.4}

/* bugs */
.bug{position:absolute;z-index:20;cursor:pointer;border:0;background:none;padding:0;animation:glitch .18s steps(2) infinite}
@keyframes glitch{0%{transform:translate(0,0)}50%{transform:translate(2px,-1px)}100%{transform:translate(-1px,1px)}}
.bug-e0{font-family:monospace;font-size:16px;color:#f00;background:#000;padding:2px 6px}
body.has-color .bug-e0{color:var(--hot);background:#1a0008;border:1px solid var(--hot)}
.bug-e1{background:var(--bg2);border:1px solid var(--hot);border-radius:6px;padding:8px 12px;color:var(--fg);text-align:left;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.bug-e1 b{display:block;color:var(--hot);font-size:13px} .bug-e1 small{font-family:var(--font-num);color:var(--muted)}
.bug-e2,.bug-e3{width:46px;height:46px;border-radius:50%;border:2px dashed var(--hot);color:var(--hot);font-size:20px;background:rgba(255,93,115,.1);box-shadow:0 0 22px rgba(255,93,115,.45)}
.bug-e3{border-radius:4px;transform:rotate(45deg)}

/* overlays */
.ovl{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(3,6,14,.78);padding:16px;overflow:auto}
.modal{width:min(720px,100%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;box-sizing:border-box;max-height:calc(100vh - 32px);overflow:auto}
.modal h2{margin:0 0 6px;font-family:var(--font-display);font-weight:400;font-size:22px;letter-spacing:.06em;color:var(--accent)}
.modal p{color:var(--muted);line-height:1.7;margin:0 0 14px;font-size:14px}
.modal .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:16px}
.codes{display:flex;gap:24px;flex-wrap:wrap;margin:10px 0 16px;font-family:var(--font-num)}
.codes div{display:flex;flex-direction:column} .codes span{font-size:12px;color:var(--muted)} .codes b{font-size:26px;font-weight:400;color:var(--accent2)}
.libs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.lib{border:1px solid var(--line);background:var(--bg2);border-radius:8px;padding:10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.lib b{font-size:14px} .lib small{color:var(--muted);font-size:12px;line-height:1.45} .lib em{font-style:normal;font-family:var(--font-num);color:var(--accent2);font-size:13px}
.lib.own{border-color:var(--accent2);cursor:default} .lib.own em{color:var(--good)}
.lib.no{opacity:.5;cursor:default}
.mbtn{background:var(--bg2);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
.mbtn.pri{background:var(--accent);border-color:var(--accent);color:var(--gel-text);font-family:var(--font-display)}
.mbtn.warn{border-color:var(--hot);color:var(--hot)}
.mbtn:disabled{opacity:.45;cursor:default}
.set{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:12px}
.fx{position:fixed;inset:0;z-index:70;pointer-events:none}
.compile{position:fixed;inset:0;z-index:90;background:#000;color:#62d6ff;font-family:"DotGothic16",monospace;font-size:13px;overflow:hidden;padding:20px;line-height:1.3;word-break:break-all;opacity:0;transition:opacity .4s}
.compile.on{opacity:1}
.ending{position:fixed;inset:0;z-index:95;background:#000;display:grid;place-items:center;text-align:center;padding:24px;color:#e8eefa;font-family:"DotGothic16",monospace}
.ending p{font-size:20px;line-height:2;margin:0;opacity:0;transition:opacity 1.2s}
.ending p.on{opacity:1}

@media (max-width:860px){
  body{overflow:auto}
  #shell{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 62vh auto;height:auto;min-height:100%}
  #hud{grid-column:1}
  #panel{border-left:0;border-top:1px solid var(--line)}
  #shop{overflow:visible}
  .hud-era{margin-left:0}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>

<div id="app"></div>

<script>
/*ECON-START*/
const PROD=[
  {k:'button',  name:'ボタン',       era:1, base:3,    cost:120,   desc:'押されるのを待つ、最小の部品。'},
  {k:'slider',  name:'スライダー',   era:1, base:22,   cost:1500,  desc:'値を連続的に生み出す。'},
  {k:'graph',   name:'グラフ',       era:1, base:150,  cost:2.0e4, desc:'数字に形を与える。'},
  {k:'terminal',name:'ターミナル',   era:1, base:1100, cost:2.6e5, desc:'自分自身を記述しはじめる。'},
  {k:'cpu',     name:'プロセッサ',   era:2, base:9000, cost:4.5e6, desc:'命令を並列に解釈する。'},
  {k:'neural',  name:'ニューラル網', era:2, base:8.0e4,cost:9.0e7, desc:'自分の配線を学習する。'},
  {k:'poly',    name:'ポリゴン',     era:3, base:8.0e5,cost:2.5e9, desc:'面で世界を張る。'},

  {k:'preset',    cost:[1],       name:'起動プリセット',    desc:'テキスト期の構成要素（ウィンドウ以外）を最初から持つ'},

  {k:'autoscript',cost:[10],      name:'自己記述スクリプト',desc:'買える一番安い生成モジュールを自動で設置する'},
  {k:'eternal',   cost:[15],      name:'永続ループ',        desc:'ウィンドウ期から2×2の正方形がループになる。ループ倍率 +1'},

let S=null;
function fresh(){ return {v:1,px:0,runTotal:0,allTotal:0,clicks:0,era:0,comps:{},cursors:0,cursorUpg:0,coreUpg:0,typeUpg:{},
  mods:[],links:[],nid:1,layers:0,heat:0,codes:0,codesTotal:0,libs:{},refactors:0,rows:4,seen:{},t:Date.now(),play:0,
  ended:false,auto:true,sound:true,log:[],best:0}; }

const cnt=k=>S.mods.reduce((a,m)=>a+(m.k===k?1:0),0);
function globalMult(){ return (1+0.03*S.codesTotal)*(1+S.layers); }
function cursorSpeed(){ return 0.2*(S.comps.color?2:1)*Math.pow(2,S.cursorUpg); }
function clickBase(){ return (1+(S.comps.border?1:0))*(S.comps.font?2:1)*Math.pow(2,S.coreUpg); }
function heatMax(){ return S.libs.parallel?20:10; }
function heatMult(){ return S.comps.anim ? 1+(heatMax()-1)*S.heat*S.heat : 1; }
function loopsOn(){ return S.era>=2 ? !!(S.comps.feedback||S.libs.eternal) : (S.era===1 && !!S.libs.eternal); }
function loopMult(){ return (S.comps.recursion?3:2)+(S.libs.eternal?1:0); }
function heightBase(){ return S.comps.normal?3:2; }
function capOf(m){ return (m.k==='core'||m.k==='router')?8:4; }
function gridCols(){ return 6+(S.libs.grid||0); }
function coreCell(){ return {x:Math.floor((gridCols()-1)/2),y:1}; }
function gridFull(){ return S.era===1 && S.mods.length>=gridCols()*S.rows; }
function coreMod(){ return S.mods.find(m=>m.k==='core'); }
function byId(id){ return S.mods.find(m=>m.id===id); }

let G=null, C=null;
function dirty(){ G=null; C=null; }
function graph(){
  if(G) return G;
  const g=new Map(); S.mods.forEach(m=>g.set(m.id,[]));
  if(S.era===1){
    for(let i=0;i<S.mods.length;i++) for(let j=i+1;j<S.mods.length;j++){
      const a=S.mods[i], b=S.mods[j];
      if(Math.abs(a.gx-b.gx)+Math.abs(a.gy-b.gy)===1){ g.get(a.id).push(b.id); g.get(b.id).push(a.id); }
    }
  } else {
    S.links.forEach(([a,b])=>{ if(g.has(a)&&g.has(b)){ g.get(a).push(b); g.get(b).push(a); } });
  }
  return (G=g);
}
function edgeKey(a,b){ return a<b?a+'-'+b:b+'-'+a; }
function bridgesOf(g){
  const disc=new Map(), low=new Map(), br=new Set(); let t=0;
  const dfs=(u,p)=>{ disc.set(u,t); low.set(u,t); t++;
    for(const v of g.get(u)){ if(v===p) continue;
      if(!disc.has(v)){ dfs(v,u); low.set(u,Math.min(low.get(u),low.get(v))); if(low.get(v)>disc.get(u)) br.add(edgeKey(u,v)); }
      else low.set(u,Math.min(low.get(u),disc.get(v)));
    } };
  for(const u of g.keys()) if(!disc.has(u)) dfs(u,-1);
  return br;
}
function loopInfo(g){
  const br=bridgesOf(g), nodes=new Set(), edges=new Set();
  for(const [u,ns] of g) for(const v of ns){ const k=edgeKey(u,v); if(!br.has(k)){ nodes.add(u); edges.add(k); } }
  return {nodes,edges};
}
function reachableFrom(g,id){
  const seen=new Set([id]), q=[id];
  while(q.length){ const u=q.shift(); for(const v of (g.get(u)||[])) if(!seen.has(v)){ seen.add(v); q.push(v); } }
  return seen;
}
function synergy(d){
  if(d.i===0) return 1+0.01*S.cursors;
  return 1+0.04*cnt(PROD[d.i-1].k);
}
function calc(){
  if(C) return C;
  const g=graph(), glob=globalMult();
  const cp=clickBase()*glob;
  const cursorRate=S.cursors*cursorSpeed()*cp;
  const core=coreMod();
  const L = loopsOn()? loopInfo(g) : {nodes:new Set(),edges:new Set()};
  const lm=loopMult();
  const conn = (S.era>=2 && core) ? reachableFrom(g,core.id) : null;
  const info=new Map(); let moduleRate=0;
  const idx=new Map(S.mods.map(m=>[m.id,m]));
  const reachOf=id=>{ const r=new Set(g.get(id)||[]); for(const n of (g.get(id)||[])){ const nm=idx.get(n); if(nm&&nm.k==='router') for(const x of g.get(n)) if(x!==id) r.add(x); } return r; };
  for(const m of S.mods){
    const d=DEF[m.k]; if(d.type!=='prod') continue;
    const lvl=S.typeUpg[m.k]||0;
    const base=d.base*Math.pow(2,lvl), syn=synergy(d);
    const reach=reachOf(m.id);
    let amps=0; for(const x of reach){ const xm=idx.get(x); if(xm&&xm.k==='amp') amps++; }
    const coreL = core && reach.has(core.id);
    const loop = L.nodes.has(m.id);
    const hm = Math.pow(heightBase(), m.h||0);
    const disc = conn && !conn.has(m.id);
    const v = base*syn*(1+0.6*amps)*(coreL?2:1)*(loop?lm:1)*hm*glob*(disc?0.25:1);
    info.set(m.id,{v,base,lvl,syn,amps,coreL,loop,hm,disc});
    moduleRate+=v;
  }
  for(const m of S.mods){
    if(m.k!=='mirror') continue;
    let src=0; for(const x of (g.get(m.id)||[])){ const i=info.get(x); if(i&&DEF[idx.get(x).k].type==='prod') src+=i.v; }
    const loop=L.nodes.has(m.id), hm=Math.pow(heightBase(),m.h||0), disc=conn&&!conn.has(m.id);
    const v=src*0.3*(loop?lm:1)*hm*(disc?0.25:1);
    info.set(m.id,{v,src,loop,hm,disc,mirror:true});
    moduleRate+=v;
  }
  C={cp,cursorRate,moduleRate,total:cursorRate+moduleRate,info,loops:L,conn,glob};
  return C;
}
function clickValue(c,fz){ return (c.cp + (S.comps.shortcut?0.04*c.moduleRate:0))*heatMult()*(fz?7:1); }
function addPx(v){ S.px+=v; S.runTotal+=v; S.allTotal+=v; }

function modCost(k){ const d=DEF[k]; return d.cost*Math.pow(d.growth,cnt(k)); }
function sellValue(k){ const d=DEF[k]; return d.cost*Math.pow(d.growth,Math.max(0,cnt(k)-1))*0.5; }
function upgCost(k){ return DEF[k].cost*10*Math.pow(6,S.typeUpg[k]||0); }
function coreUpgCost(){ return 300*Math.pow(9,S.coreUpg); }
function cursorCost(){ return 15*Math.pow(1.15,S.cursors); }
function cursorUpgCost(){ return 150*Math.pow(12,S.cursorUpg); }
function compCost(c){ return c.cost*((c.shift&&S.libs.inline)?0.2:1); }
function extrudeCost(m){ return DEF[m.k].cost*30*Math.pow(9,m.h||0); }
function layerCost(){ return 5e10*Math.pow(20,S.layers); }
function codeGain(){ return Math.floor(Math.cbrt(S.runTotal/1e6)); }
function libLevel(k){ return S.libs[k]||0; }
function libNextCost(l){ const lv=libLevel(l.k); return lv<l.cost.length? l.cost[lv] : null; }
/*ECON-END*/
</script>

const UNITS=[[1e24,'秭'],[1e20,'垓'],[1e16,'京'],[1e12,'兆'],[1e8,'億'],[1e4,'万']];
function fmt(n){
  if(!isFinite(n)) return '∞';
  if(n<0) return '-'+fmt(-n);
  if(n<1e4){ if(n<100 && n%1>0.0001) return n<10? n.toFixed(1) : n.toFixed(0); return Math.floor(n).toLocaleString('ja-JP'); }
  if(n>=1e28) return n.toExponential(2).replace('e+','e');
  for(const [v,u] of UNITS) if(n>=v){ const x=n/v; return (x<10?x.toFixed(2):x<100?x.toFixed(1):Math.floor(x))+u; }
}
function fmtTime(s){ s=Math.floor(s); const h=Math.floor(s/3600), m=Math.floor(s%3600/60); return h? `${h}時間${m}分` : `${m}分${s%60}秒`; }

// ---------- sound ----------
let AC=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=false; } } return AC||null; }
function tone(f,dur,type,vol,slide,delay){
  if(!S||!S.sound) return; const c=ac(); if(!c) return;
  try{
    const t=c.currentTime+(delay||0), o=c.createOscillator(), g=c.createGain();
    o.type=type||'square'; o.frequency.setValueAtTime(f,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+dur);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.04,t+0.006); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+0.03);
  }catch(e){}
}
const snd={

  if(k==='boundary'){ ending(); return; }
  if(S.era===0){ setBodyClasses(); renderE0Static(); }
  else { setBodyClasses(); }
}

function startPlace(k,auto){
  const cost=modCost(k);
  if(S.px<cost){ snd.deny(); return; }
  moving=null;
  if(S.era===1){
    const empt=emptyCells();
    if(!empt.length){ log('> 空きセルがありません。撤去するか、枠の外へ。','bad'); snd.deny(); return; }
    if(auto){ placeAt(k,empt[0]); return; }
    placing={k}; renderGrid();
  } else if(S.era===2){
    if(auto){ placeAt(k,autoSpot()); return; }
    placing={k};
  } else {
    placeAt(k,autoSpot());
  }
  refreshSel(true);
}
function placeAt(k,pos){
  const cost=modCost(k);
  if(S.px<cost){ snd.deny(); placing=null; refreshSel(true); return null; }
  S.px-=cost;
  const m={id:S.nid++,k,h:0};
  if(S.era===1){ m.gx=pos.x; m.gy=pos.y; } else { m.wx=pos.x; m.wy=pos.y; }
  S.mods.push(m);
  if(S.era>=2) autoLink(m);
  dirty(); snd.place(); lastPlaced=m.id;
  if(S.era===1){ renderGrid(m.id); if(gridFull()) log('> 警告: 画面に空きがありません。ウィンドウ枠が軋んでいる。','bad'); }
  return m;
}

function renderCursors(){
  const host=$('#curs'); if(!host) return;
  host.classList.add('spin');
  const shown=Math.min(S.cursors,24);
  const r = S.era===0 ? 112 : (G1? G1.cell*0.74 : 70);
  let html='';
  for(let i=0;i<shown;i++){
    const ring = i<12?0:1;
    const k = ring? i-12 : i, n = ring? Math.min(12,shown-12) : Math.min(12,shown);
    const a = (k/n)*Math.PI*2 + ring*0.26;
    const rr = r + ring*22;
    const x=Math.cos(a)*rr, y=Math.sin(a)*rr;
    const rot = a*180/Math.PI - 45; // arrow tip faces the core
    html+=`<span class="cur" style="left:${x.toFixed(1)}px;top:${y.toFixed(1)}px;transform:rotate(${rot.toFixed(1)}deg)"><svg viewBox="0 0 13 20"><path d="M1 1 L1 15 L4.6 11.6 L7.4 18 L9.6 17 L6.9 10.8 L11.8 10.8 Z"/></svg></span>`;
  }
  if(S.cursors>24) html+=`<span class="cur-more" style="top:${r+40}px">+${S.cursors-24}</span>`;
  host.innerHTML=html;
}
let curAcc=0;
function cursorVisual(dt){
  if(!S.comps.anim || S.era>1 || !S.cursors) return;
  curAcc += S.cursors*cursorSpeed()*dt;
  if(curAcc>=1){
    curAcc = Math.min(curAcc-1, 3);
    const list=document.querySelectorAll('#curs .cur'); if(!list.length) return;
    const el=list[Math.floor(Math.random()*list.length)];
    el.classList.remove('tap'); void el.offsetWidth; el.classList.add('tap');
  }
}

// ===== ERA 1 GRID =====
let G1=null;
function layoutGrid(){
  const st=$('#stage'); if(!st) return; const r=st.getBoundingClientRect();
  const cols=gridCols(), rows=S.rows, gap=12;
  let cell=Math.floor(Math.min((r.width-80-gap*(cols-1))/cols,(r.height-130-gap*(rows-1))/rows,108));
  cell=Math.max(cell,42);
  G1={cell,gap,cols,rows,w:cols*cell+(cols-1)*gap,h:rows*cell+(rows-1)*gap};
  const g=$('#grid'); g.style.width=G1.w+'px'; g.style.height=G1.h+'px';
}
const cellXY=(x,y)=>[x*(G1.cell+G1.gap), y*(G1.cell+G1.gap)];
function emptyCells(){
  const occ=new Set(S.mods.map(m=>m.gx+','+m.gy)); const core=coreMod(); const out=[];
  for(let y=0;y<S.rows;y++) for(let x=0;x<gridCols();x++) if(!occ.has(x+','+y)) out.push({x,y});
  if(core) out.sort((a,b)=>(Math.abs(a.x-core.gx)+Math.abs(a.y-core.gy))-(Math.abs(b.x-core.gx)+Math.abs(b.y-core.gy)));
  return out;
}
function renderGrid(popId){
  const g=$('#grid'); if(!g||!G1) return;
  const c=calc(), gr=graph(), {cell}=G1;
  const occ=new Set(S.mods.map(m=>m.gx+','+m.gy));
  let lines='', slots='', tiles='';
  const done=new Set();
  for(const m of S.mods) for(const n of gr.get(m.id)){
    const k=edgeKey(m.id,n); if(done.has(k)) continue; done.add(k);
    const o=byId(n); const [ax,ay]=cellXY(m.gx,m.gy), [bx,by]=cellXY(o.gx,o.gy);
    const act=(m.k==='amp'||o.k==='amp'||m.k==='core'||o.k==='core'||m.k==='mirror'||o.k==='mirror') && (DEF[m.k].type==='prod'||DEF[o.k].type==='prod');
    const lp=c.loops.edges.has(k);
    lines+=`<line x1="${ax+cell/2}" y1="${ay+cell/2}" x2="${bx+cell/2}" y2="${by+cell/2}" class="${act?'act':''}${lp?' loop':''}"/>`;
  }
  for(let y=0;y<S.rows;y++) for(let x=0;x<gridCols();x++){
    if(occ.has(x+','+y)) continue; const [l,t]=cellXY(x,y);
    slots+=`<div class="slot${(placing||moving)?' can':''}" data-x="${x}" data-y="${y}" style="left:${l}px;top:${t}px;width:${cell}px;height:${cell}px"></div>`;
  }
  for(const m of S.mods){
    const [l,t]=cellXY(m.gx,m.gy), d=DEF[m.k];
    const cls=['tile']; if(m.k==='core') cls.push('core'); if(selected===m.id) cls.push('sel'); if(moving===m.id) cls.push('moving'); if(popId===m.id && S.comps.anim) cls.push('pop');
    const label = m.k==='core' ? '生成' : d.name;
    tiles+=`<div class="${cls.join(' ')}" data-id="${m.id}" style="left:${l}px;top:${t}px;width:${cell}px;height:${cell}px;--tc:${TCOL[m.k]}">${svgIcon(m.k)}<span class="tn">${label}</span><span class="tv" data-v="${m.id}"></span></div>`;
  }
  g.innerHTML=`<svg class="glinks" width="${G1.w}" height="${G1.h}">${lines}</svg>${slots}${tiles}<div class="curs" id="curs"></div>`;
  const core=coreMod();
  if(core){ const [l,t]=cellXY(core.gx,core.gy); const cu=$('#curs'); cu.style.left=(l+cell/2)+'px'; cu.style.top=(t+cell/2)+'px'; }
  renderCursors(); updateGrid();
}
function updateGrid(){
  if(S.era!==1) return;
  const c=calc();
  const info=$('#wininfo');
  if(info){ const free=gridCols()*S.rows-S.mods.length; info.textContent=`${gridCols()}×${S.rows} ・ 空き ${free}`; info.classList.toggle('full',free===0); $('#win').classList.toggle('creak', free===0 && !!S.comps.anim); }
  document.querySelectorAll('.tile').forEach(el=>{
    const id=+el.dataset.id, m=byId(id); if(!m) return;
    const tv=el.querySelector('.tv');
    if(m.k==='core'){ tv.textContent='+'+fmt(clickValue(c,frenzyT>0)); return; }
    const i=c.info.get(id);
    tv.textContent = i? fmt(i.v)+'/秒' : '';
    el.classList.toggle('loop', !!(i&&i.loop));

}
function gridPointer(e){
  ac();
  const tile=e.target.closest('.tile'), slot=e.target.closest('.slot');
  if(tile){
    const m=byId(+tile.dataset.id);
    if(m.k==='core'){ e.preventDefault(); doClick(e.clientX,e.clientY); updateUI(); return; }
    if(placing||moving){ placing=null; moving=null; }
    selected = selected===m.id? null : m.id; renderGrid(); refreshSel(true); return;
  }
  if(slot){
    const pos={x:+slot.dataset.x,y:+slot.dataset.y};
    if(placing){ const k=placing.k; const ok=placeAt(k,pos); if(!(e.shiftKey && ok)) placing=null; renderGrid(); refreshSel(true); return; }
    if(moving){ const m=byId(moving); m.gx=pos.x; m.gy=pos.y; moving=null; dirty(); snd.place(); renderGrid(m.id); refreshSel(true); return; }
    selected=null; renderGrid(); refreshSel(true);
  }
}

// ===== canvas (era 2/3) =====
let cv=null, cx=null, dpr=1, cam2={x:0,y:0,z:1}, cam3={yaw:0.7,pitch:0.62,dist:1000,tPitch:0.62,tDist:1000,tx:0,tz:0,anim:0};
let ptr=null, hover=null, corePulse=0, zoomAnim=0;
function setupCanvas(){
  cv=$('#cv'); cx=cv.getContext('2d');
  const rs=()=>{ dpr=Math.min(2,window.devicePixelRatio||1); const r=cv.getBoundingClientRect(); cv.width=Math.max(1,r.width*dpr); cv.height=Math.max(1,r.height*dpr); };
  rs(); new ResizeObserver(rs).observe(cv);
  cv.addEventListener('contextmenu',e=>e.preventDefault());
  cv.addEventListener('pointerdown',e=>{
    ac(); try{cv.setPointerCapture(e.pointerId);}catch(_){}
    const p=locPt(e);
    if(e.button===2){ placing=null; selected=null; refreshSel(true); return; }
    ptr={x0:p[0],y0:p[1],x:p[0],y:p[1],hit:pick(p[0],p[1]),moved:false,shift:e.shiftKey,cx:e.clientX,cy:e.clientY};
  });
  cv.addEventListener('pointermove',e=>{
    const p=locPt(e); hover=p;
    if(!ptr) return;
    const dx=p[0]-ptr.x, dy=p[1]-ptr.y; ptr.x=p[0]; ptr.y=p[1];
    if(!ptr.moved && Math.hypot(p[0]-ptr.x0,p[1]-ptr.y0)>5) ptr.moved=true;
    if(!ptr.moved) return;
    if(S.era===2){
      if(ptr.hit && !placing){ const w=s2w(p[0],p[1]); ptr.hit.wx=w[0]; ptr.hit.wy=w[1]; }
      else { cam2.x-=dx/cam2.z; cam2.y-=dy/cam2.z; }
    } else {
      cam3.yaw+=dx*0.008; cam3.tPitch=cam3.pitch=Math.max(0.12,Math.min(1.5,cam3.pitch+dy*0.005));
    }
  });
  const up=e=>{
    if(!ptr) return; const p=ptr; ptr=null;
    if(!p.moved) canvasTap(p.x0,p.y0,p.hit,e.shiftKey||p.shift,e.clientX,e.clientY);
  };
  cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',()=>ptr=null);
  cv.addEventListener('pointerleave',()=>{hover=null;});
  cv.addEventListener('wheel',e=>{
    e.preventDefault();
    if(S.era===2){ const p=locPt(e); const before=s2w(p[0],p[1]); cam2.z=Math.max(0.25,Math.min(2.5,cam2.z*Math.exp(-e.deltaY*0.0012))); const after=s2w(p[0],p[1]); cam2.x+=before[0]-after[0]; cam2.y+=before[1]-after[1]; }
    else { cam3.tDist=Math.max(300,Math.min(6000,cam3.tDist*Math.exp(e.deltaY*0.0012))); }
  },{passive:false});
}
function locPt(e){ const r=cv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
function cvSize(){ return [cv.width/dpr, cv.height/dpr]; }
function w2s(x,y){ const [W,H]=cvSize(); return [(x-cam2.x)*cam2.z+W/2,(y-cam2.y)*cam2.z+H/2]; }
function s2w(x,y){ const [W,H]=cvSize(); return [(x-W/2)/cam2.z+cam2.x,(y-H/2)/cam2.z+cam2.y]; }
const NR=30;
function nodeTop(m){ return DEF[m.k].type==='prod'||m.k==='mirror' ? 26+(m.h||0)*34 : m.k==='core'? 80 : 44; }
function pick(x,y){
  let best=null, bd=1e9;
  for(const m of S.mods){
    let p, rr;
    if(S.era===2){ p=w2s(m.wx,m.wy); rr=(NR+6)*cam2.z; }
    else { p=proj3(m.wx,nodeTop(m)*0.5,m.wy); if(!p) continue; rr=Math.max(18,44*p[2]); }
    const d=Math.hypot(p[0]-x,p[1]-y); if(d<rr && d<bd){ bd=d; best=m; }
  }

}
function canvasTap(x,y,hit,shift,clx,cly){
  if(placing && S.era===2){
    const w=s2w(x,y);
    if(S.mods.some(m=>Math.hypot(m.wx-w[0],m.wy-w[1])<NR*2.2)){ log('> 近すぎます。少し離して置く。','bad'); snd.deny(); return; }
    const ok=placeAt(placing.k,{x:w[0],y:w[1]}); if(!(shift&&ok)) placing=null; refreshSel(true); return;
  }
  if(hit){
    if(selected!=null && hit.id!==selected){ toggleLink(selected,hit.id); return; }
    if(hit.k==='core' && selected==null){ doClick(clx,cly); updateUI(); return; }
    selected = hit.id===selected? null : hit.id; refreshSel(true); return;
  }
  selected=null; refreshSel(true);
}
function deg(id){ return S.links.reduce((a,l)=>a+((l[0]===id||l[1]===id)?1:0),0); }
function toggleLink(a,b){
  const i=S.links.findIndex(l=>(l[0]===a&&l[1]===b)||(l[0]===b&&l[1]===a));
  if(i>=0){ S.links.splice(i,1); snd.unlink(); }
  else {
    const ma=byId(a), mb=byId(b);
    if(deg(a)>=capOf(ma)||deg(b)>=capOf(mb)){ log('> 接続上限に達しています。','bad'); snd.deny(); return; }
    S.links.push([a,b]); snd.link();
  }
  dirty(); refreshSel(true);
}
function autoSpot(){
  const base = (selected!=null&&byId(selected)) || (lastPlaced!=null&&byId(lastPlaced)) || coreMod();
  const ok=(x,y)=>!S.mods.some(m=>Math.hypot(m.wx-x,m.wy-y)<120);
  for(let r=140;r<4000;r+=70){
    const n=Math.max(6,Math.floor(r/40)), off=Math.random()*Math.PI*2;
    for(let i=0;i<n;i++){ const a=off+i/n*Math.PI*2; const x=base.wx+Math.cos(a)*r, y=base.wy+Math.sin(a)*r; if(ok(x,y)) return {x,y}; }
  }

}
function autoLink(m){
  const cand=S.mods.filter(o=>o.id!==m.id && deg(o.id)<capOf(o)).sort((a,b)=>Math.hypot(a.wx-m.wx,a.wy-m.wy)-Math.hypot(b.wx-m.wx,b.wy-m.wy));
  if(cand[0]) S.links.push([m.id,cand[0].id]);
}

// ----- era 2 drawing -----
function drawE2(t){
  const [W,H]=cvSize(); const ctx=cx;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#08152b'; ctx.fillRect(0,0,W,H);
  if(zoomAnim>0){ zoomAnim=Math.max(0,zoomAnim-0.016); cam2.z = 1 + 0.9*zoomAnim*zoomAnim; }
  // dot grid
  const step=40*cam2.z; if(step>9){
    const o=w2s(0,0); const sx=((o[0]%step)+step)%step, sy=((o[1]%step)+step)%step;
    ctx.fillStyle='rgba(98,214,255,.13)';
    for(let x=sx;x<W;x+=step) for(let y=sy;y<H;y+=step) ctx.fillRect(x-1,y-1,2,2);
  }
  const c=calc(), g=graph(), core=coreMod(); if(!core) return;

  const dist=new Map([[core.id,0]]), q=[core.id];
  while(q.length){ const u=q.shift(); for(const v of g.get(u)) if(!dist.has(v)){ dist.set(v,dist.get(u)+1); q.push(v); } }

    ctx.beginPath(); ctx.moveTo(pa[0],pa[1]); ctx.lineTo(pb[0],pb[1]); ctx.stroke();
    const da=dist.get(a), db=dist.get(b);
    if(da!=null&&db!=null&&da!==db){
      const [from,to,pf,pt]= da>db? [ma,mb,pa,pb] : [mb,ma,pb,pa];
      const iv=c.info.get(from.id); const nP = iv? Math.min(4,1+Math.floor(Math.log10(1+iv.v)/2)) : 1;
      ctx.fillStyle=TCOL[from.k];
      for(let k=0;k<nP;k++){ const f=((t*0.55+k/nP+(a*0.137))%1); const x=pf[0]+(pt[0]-pf[0])*f, y=pf[1]+(pt[1]-pf[1])*f; ctx.globalAlpha=Math.sin(f*Math.PI); ctx.fillRect(x-2.5,y-2.5,5,5); }
      ctx.globalAlpha=1;
    }
  }
  // link preview from selection
  if(selected!=null && hover){ const sm=byId(selected); if(sm){ const p=w2s(sm.wx,sm.wy); ctx.setLineDash([4,6]); ctx.strokeStyle='rgba(255,178,62,.6)'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(p[0],p[1]); ctx.lineTo(hover[0],hover[1]); ctx.stroke(); ctx.setLineDash([]); } }
  // nodes
  const z=cam2.z, R=NR*z;
  ctx.textAlign='center';
  if(corePulse>0) corePulse=Math.max(0,corePulse-0.08);
  for(const m of S.mods){
    const p=w2s(m.wx,m.wy); if(p[0]<-80||p[1]<-80||p[0]>W+80||p[1]>H+80) continue;
    const i=c.info.get(m.id), col=TCOL[m.k];
    const disc = c.conn && !c.conn.has(m.id);
    ctx.globalAlpha = disc? .45 : 1;
    const rr = m.k==='core'? R*1.25*(1+corePulse*0.08) : R;
    ctx.beginPath(); ctx.arc(p[0],p[1],rr,0,Math.PI*2);
    ctx.fillStyle = m.k==='core'? '#3a2406' : '#0f2448'; ctx.fill();
    ctx.lineWidth=2; ctx.strokeStyle=col; ctx.shadowColor=col; ctx.shadowBlur= m.k==='core'? 18+corePulse*20 : 8; ctx.stroke(); ctx.shadowBlur=0;
    // icon

    for(let k=0;k<cap;k++){ const a=-Math.PI/2+(k-(cap-1)/2)*0.28; const px=p[0]+Math.cos(a)*(rr+7), py=p[1]+Math.sin(a)*(rr+7)-0; ctx.fillStyle = k<dg? col : 'rgba(147,168,201,.25)'; ctx.fillRect(px-1.5,py-1.5,3,3); }

    if(selected===m.id){ ctx.strokeStyle='#ffffff'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(p[0],p[1],rr+19,0,Math.PI*2); ctx.stroke(); }
    // labels

function drawCanvasCursors(c0,r,t){

    const a=t*0.15+i/n*Math.PI*2; const tap=(Math.sin(t*6+i*1.7)>0.92)?4:0;
    const rr=r-tap; const x=c0[0]+Math.cos(a)*rr, y=c0[1]+Math.sin(a)*rr;

// ----- era 3 drawing (wireframe) -----
let W3=0,H3=0;
function proj3(x,y,z){
  const [W,H]=cv?cvSize():[W3,H3];
  x-=cam3.tx; z-=cam3.tz;
  const cy=Math.cos(cam3.yaw), sy=Math.sin(cam3.yaw);
  const x1=x*cy-z*sy, z1=x*sy+z*cy;
  const cp=Math.cos(cam3.pitch), sp=Math.sin(cam3.pitch);
  const y2=y*cp+z1*sp, z2=-y*sp+z1*cp;
  const d=cam3.dist+z2; if(d<40) return null;
  const s=Math.min(W,H)*1.15/d;
  return [W/2+x1*s, H*0.55-y2*s, s];
}
function seg(ax,ay,az,bx,by,bz){ const a=proj3(ax,ay,az), b=proj3(bx,by,bz); if(a&&b){ cx.moveTo(a[0],a[1]); cx.lineTo(b[0],b[1]); } }
function prism(x,z,n,r,y0,y1,rot){
  const P=[]; for(let i=0;i<n;i++){ const a=rot+i/n*Math.PI*2; P.push([x+Math.cos(a)*r,z+Math.sin(a)*r]); }
  for(let i=0;i<n;i++){ const p=P[i], q=P[(i+1)%n]; seg(p[0],y0,p[1],q[0],y0,q[1]); seg(p[0],y1,p[1],q[0],y1,q[1]); seg(p[0],y0,p[1],p[0],y1,p[1]); }
}
function pyramid(x,z,n,r,y0,apex,rot){
  const P=[]; for(let i=0;i<n;i++){ const a=rot+i/n*Math.PI*2; P.push([x+Math.cos(a)*r,z+Math.sin(a)*r]); }
  for(let i=0;i<n;i++){ const p=P[i], q=P[(i+1)%n]; seg(p[0],y0,p[1],q[0],y0,q[1]); seg(p[0],y0,p[1],x,apex,z); }
}
const SHAPE={button:[4,26],slider:[4,22],graph:[4,26],terminal:[6,26],cpu:[4,30],neural:[6,28],poly:[3,32],shader:[12,26],mirror:[4,24]};
function drawModel(m,yo,t){
  const x=m.wx, z=m.wy, h=m.h||0;
  if(m.k==='core'){
    const r=30, mid=yo+44, rot=t*0.9;
    const P=[0,1,2,3].map(i=>[x+Math.cos(rot+i*Math.PI/2)*r, z+Math.sin(rot+i*Math.PI/2)*r]);
    for(let i=0;i<4;i++){ const p=P[i], q=P[(i+1)%4]; seg(p[0],mid,p[1],q[0],mid,q[1]); seg(p[0],mid,p[1],x,mid+40,z); seg(p[0],mid,p[1],x,mid-40,z); }
    return;
  }
  if(m.k==='amp'){ pyramid(x,z,4,26,yo,yo+48,Math.PI/4); return; }
  if(m.k==='router'){ prism(x,z,8,22,yo,yo+14,0); prism(x,z,8,10,yo+14,yo+40,0); return; }
  const [n,r]=SHAPE[m.k]||[4,24];
  const top=yo+26+h*34;
  if(m.k==='mirror'){ pyramid(x,z,4,r,yo+top*0+ (top-yo)/2, top, Math.PI/4); pyramid(x,z,4,r,yo+(top-yo)/2, yo, Math.PI/4); return; }
  prism(x,z,n,r,yo,top,Math.PI/4);
  for(let k=1;k<=h;k++){ const y=yo+26+(k-1)*34+26; prism(x,z,n,r*0.82,y,y,Math.PI/4); }
  if(m.k==='graph'){ seg(x-10,yo,z,x-10,yo+(top-yo)*0.5,z); seg(x+10,yo,z,x+10,yo+(top-yo)*0.85,z); }
  if(m.k==='cpu'){ prism(x,z,4,r*0.5,top,top+8,Math.PI/4); }
}
function drawE3(t,dt){
  const [W,H]=cvSize(); W3=W; H3=H; const ctx=cx;
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='#05070e'; ctx.fillRect(0,0,W,H);
  if(cam3.anim>0){ cam3.anim=Math.max(0,cam3.anim-dt/3); const e=cam3.anim*cam3.anim; cam3.pitch=0.62+(1.52-0.62)*e; }
  cam3.dist += (cam3.tDist-cam3.dist)*Math.min(1,dt*6);
  if(!ptr) cam3.yaw+=dt*0.04;
  const c=calc(), core=coreMod(); if(!core) return;
  let E=300; for(const m of S.mods) E=Math.max(E,Math.abs(m.wx-core.wx)+180,Math.abs(m.wy-core.wy)+180);
  cam3.tx+= (core.wx-cam3.tx)*0.1; cam3.tz+=(core.wy-cam3.tz)*0.1;
  // floor grid
  ctx.lineWidth=1; ctx.strokeStyle='rgba(98,214,255,.10)'; ctx.beginPath();
  const g0=Math.ceil(E/70)*70;
  for(let v=-g0; v<=g0; v+=70){ seg(core.wx+v,0,core.wy-g0,core.wx+v,0,core.wy+g0); seg(core.wx-g0,0,core.wy+v,core.wx+g0,0,core.wy+v); }
  ctx.stroke();
  ctx.globalCompositeOperation='lighter';
  const LH=230;
  for(let L=S.layers; L>=0; L--){
    const yo=L*LH, alpha = L===0? 1 : Math.max(.18,.5-L*0.06);
    // links
    for(const [a,b] of S.links){
      const ma=byId(a), mb=byId(b); if(!ma||!mb) continue;
      const lp=c.loops.edges.has(edgeKey(a,b));
      ctx.strokeStyle = lp? `rgba(98,214,255,${.8*alpha})` : `rgba(90,130,200,${.5*alpha})`; ctx.lineWidth=lp?2:1.2;
      ctx.beginPath(); seg(ma.wx,yo+2,ma.wy,mb.wx,yo+2,mb.wy); ctx.stroke();
      if(L===0){ const f=(t*0.5+a*0.13)%1; const p=proj3(ma.wx+(mb.wx-ma.wx)*f,4,ma.wy+(mb.wy-ma.wy)*f); if(p){ ctx.fillStyle=TCOL[ma.k]; ctx.fillRect(p[0]-2,p[1]-2,4,4); } }
    }
    // nodes
    for(const m of S.mods){
      const disc=c.conn&&!c.conn.has(m.id);
      ctx.strokeStyle=TCOL[m.k]; ctx.globalAlpha=alpha*(disc?.4:1); ctx.lineWidth = selected===m.id&&L===0? 2.2 : 1.3;
      ctx.beginPath(); drawModel(m,yo,t); ctx.stroke();
      if(L===0 && selected===m.id){ ctx.strokeStyle='#ffffff'; ctx.beginPath(); prism(m.wx,m.wy,8,46,1,1,0); ctx.stroke(); }
      if(L===0 && c.info.get(m.id)&&c.info.get(m.id).loop){ ctx.strokeStyle='rgba(98,214,255,.6)'; ctx.beginPath(); prism(m.wx,m.wy,16,38,1,1,t*0.5); ctx.stroke(); }
    }
    ctx.globalAlpha=1;
  }
  if(S.layers){ ctx.strokeStyle='rgba(255,178,62,.35)'; ctx.beginPath(); seg(core.wx,0,core.wy,core.wx,S.layers*LH+90,core.wy); ctx.stroke(); }
  ctx.globalCompositeOperation='source-over';
  // labels
  ctx.textAlign='center';
  for(const m of S.mods){
    const p=proj3(m.wx,nodeTop(m)+14,m.wy); if(!p) continue;
    const i=c.info.get(m.id);
    if(m.k==='core'||selected===m.id||(i&&p[2]>0.55)){
      ctx.font='11px DotGothic16,monospace'; ctx.fillStyle= selected===m.id? '#ffffff' : 'rgba(232,238,250,.75)';
      ctx.fillText(m.k==='core'? 'コア +'+fmt(clickValue(c,frenzyT>0)) : (i? fmt(i.v)+'/秒' : DEF[m.k].name), p[0], p[1]);
    }
  }
  const cp=proj3(core.wx,84,core.wy); if(cp) drawCanvasCursors(cp, 70*cp[2]+26, t);
}

// ===== era transitions =====
function ensureCore(){ if(!coreMod()){ const c=coreCell(); S.mods.push({id:S.nid++,k:'core',gx:c.x,gy:c.y,h:0}); } }
function enterEra(n){
  selected=null; placing=null; moving=null; snd.shift();
  if(n===1){
    ensureCore(); S.era=1; dirty();
    log('> ウィンドウを生成。部品を並べる平面ができた。','sys');
    const e0=$('#e0');
    if(e0 && S.comps.anim){ e0.classList.add('out'); setTimeout(()=>{ render(); $('#shell').classList.add('in'); },620); }
    else render();
    return;
  }
  if(n===2){
    const core=coreMod();
    S.mods.forEach(m=>{ m.wx=(m.gx-core.gx)*140; m.wy=(m.gy-core.gy)*140; });
    const g=graph(); const L=[]; const done=new Set();
    for(const [u,ns] of g) for(const v of ns){ const k=edgeKey(u,v); if(!done.has(k)){ done.add(k); L.push([u,v]); } }
    S.links=L; S.era=2; dirty();
    const win=$('#win'); const rect=win? win.getBoundingClientRect() : null;
    if(rect) shatter(rect);
    cam2={x:0,y:0,z:1.9}; zoomAnim=1;
    render();
    log('> フレームを破壊。枠の外は、無限の回路平面だった。','sys');
    return;
  }
  if(n===3){
    S.era=3; dirty();
    let E=300; const core=coreMod(); for(const m of S.mods) E=Math.max(E,Math.hypot(m.wx-core.wx,m.wy-core.wy)+200);
    cam3={yaw:0,pitch:1.52,dist:E*2.6,tPitch:0.62,tDist:E*2.2,tx:core.wx,tz:core.wy,anim:1};
    render();
    log('> 奥行きを獲得。平面は、空間の断面にすぎなかった。','sys');
  }
}
function shatter(rect){
  const c=document.createElement('canvas'); c.className='fx'; c.width=innerWidth; c.height=innerHeight; document.body.appendChild(c);
  const ctx=c.getContext('2d'); const cxm=rect.left+rect.width/2, cym=rect.top+rect.height/2;
  const shards=[];
  for(let i=0;i<90;i++){
    const side=i%4, f=Math.random();
    let x,y; if(side===0){x=rect.left+f*rect.width;y=rect.top;} else if(side===1){x=rect.right;y=rect.top+f*rect.height;} else if(side===2){x=rect.left+f*rect.width;y=rect.bottom;} else {x=rect.left;y=rect.top+f*rect.height;}
    const a=Math.atan2(y-cym,x-cxm)+(Math.random()-.5)*.6, sp=4+Math.random()*12;
    const s=6+Math.random()*22;
    shards.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:Math.random()*6,vr:(Math.random()-.5)*.4,p:[[0,0],[s,Math.random()*s*.4],[Math.random()*s*.6,s*(.4+Math.random()*.6)]],col:Math.random()<.5?'#ffb23e':'#62d6ff'});
  }
  let life=1;
  const step=()=>{
    life-=0.018; ctx.clearRect(0,0,c.width,c.height);
    if(life>0.8){ ctx.fillStyle=`rgba(255,255,255,${(life-0.8)*2.5})`; ctx.fillRect(0,0,c.width,c.height); }
    for(const s of shards){ s.x+=s.vx; s.y+=s.vy; s.vx*=.985; s.vy*=.985; s.r+=s.vr;
      ctx.save(); ctx.translate(s.x,s.y); ctx.rotate(s.r); ctx.globalAlpha=Math.max(0,life); ctx.strokeStyle=s.col; ctx.lineWidth=1.5; ctx.fillStyle='rgba(13,33,64,.8)';
      ctx.beginPath(); ctx.moveTo(...s.p[0]); ctx.lineTo(...s.p[1]); ctx.lineTo(...s.p[2]); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore(); }
    if(life>0) requestAnimationFrame(step); else c.remove();
  };
  requestAnimationFrame(step);
}

let last=performance.now(), uiAcc=0, saveAcc=0, autoAcc=0;
function frame(now){
  let dt=(now-last)/1000; last=now; if(dt<0) dt=0; dt=Math.min(dt,43200);
  S.play+=dt;
  const c=calc(); const mult=heatMult()*(frenzyT>0?7:1);
  addPx(c.total*mult*Math.min(dt,43200));
  S.heat=Math.max(0,S.heat-(S.heat*(S.libs.parallel?0.15:0.25)+0.02)*dt);
  if(dt<1) cursorVisual(dt);
  bugTick(dt);
  uiAcc+=dt; if(uiAcc>0.15){ uiAcc=0; updateUI(); }
  saveAcc+=dt; if(saveAcc>10){ saveAcc=0; save(); }
  autoAcc+=dt; if(autoAcc>1.5){ autoAcc=0; autoBuy(); }
  try{
    if(cv && S.era===2) drawE2(now/1000);
    else if(cv && S.era===3) drawE3(now/1000,Math.min(dt,0.05));
  }catch(err){ console.error(err); }
  requestAnimationFrame(frame);
}

function boot(){
  const hot=window.claude&&window.claude.hot&&window.claude.hot.data;
  S = (hot&&hot.S) ? Object.assign(fresh(),hot.S) : (load()||fresh());
  dirty(); buildShopModel();
  if(S.comps.save && !(hot&&hot.S)){
    const away=Math.min(43200,Math.max(0,(Date.now()-S.t)/1000));
    if(away>30){ S.heat=0; const g=calc().total*away; if(g>0){ addPx(g); log(`> 不在の ${fmtTime(away)} の間に ${fmt(g)} px を生成していた。`,'good'); } }
  }
