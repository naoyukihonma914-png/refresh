<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>見本：素の画面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&amp;family=Noto+Serif+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0000ee}a:hover{color:#551a8b}
</style>
<style>html,body{background:#0e0f11} #stage{transform-origin:0 0;width:1920px;height:1080px}</style>
</head>
<body>
<!-- 見本（静止画）。1920×1080で設計。画面が狭いときは縮小して表示する -->
<div id="frame"><div id="stage">
<div style="width: 1920px; height: 1080px; box-sizing: border-box; padding: 8px; background: #ffffff; color: #000000; font-family: 'Times New Roman', 'Noto Serif JP', serif; font-size: 16px; line-height: normal; position: relative; overflow: hidden">
  <p style="margin: 16px 0"><b>目標</b>：この画面を作り上げて、v1.0 としてリリースする。</p>
  <p style="margin: 16px 0">ピクセル: 7</p>
  <p style="margin: 16px 0">
    <button type="button" style="font-family: 'Noto Sans JP', Arial, sans-serif; font-size: 13.33px; padding: 1px 6px; background: #efefef; color: #000000; border: 1px solid #767676; border-radius: 2px; line-height: normal">ピクセルを1つ生成する</button>
  </p>
  <hr style="margin: 8px 0; border: 0; border-top: 1px solid #a0a0a0; border-bottom: 1px solid #eeeeee; height: 0">
  <p style="margin: 16px 0">作れるもの</p>
  <ul style="margin: 16px 0; padding-left: 40px">
    <li style="margin: 0"><button type="button" disabled style="font-family: 'Noto Sans JP', Arial, sans-serif; font-size: 13.33px; padding: 1px 6px; background: #f7f7f7; color: #6d6d6d; border: 1px solid #c4c4c4; border-radius: 2px; line-height: normal">枠線を作る（10 ピクセル）</button></li>
  </ul>
  <p style="margin: 16px 0; font-size: 13.33px">※ まだ保存機能がありません。閉じると最初からになります。</p>
</div>
</div></div>
<script>
function fit(){var s=Math.min(1,window.innerWidth/1920);var st=document.getElementById('stage');st.style.transform='scale('+s+')';document.getElementById('frame').style.height=(1080*s)+'px';}
window.addEventListener('resize',fit);fit();
</script>
</body>
</html>
