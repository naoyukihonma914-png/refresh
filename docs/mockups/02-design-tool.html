<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>見本：UIデザインツール「組木」</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#8fb3ff}a:hover{color:#c2d5ff}
</style>
<style>html,body{background:#0e0f11} #stage{transform-origin:0 0;width:1920px;height:1080px}</style>
</head>
<body>
<!-- 見本（静止画）。1920×1080で設計。画面が狭いときは縮小して表示する -->
<div id="frame"><div id="stage">
<div style="width: 1920px; height: 1080px; display: flex; flex-direction: column; background: #1c1d20; color: #e6e7ea; font-family: 'Noto Sans JP', sans-serif; font-size: 14px; overflow: hidden; position: relative">

  <!-- 上部バー：アプリ名／ピクセル／リリース -->
  <header style="height: 60px; flex: none; position: relative; display: flex; align-items: center; gap: 14px; padding: 0 16px; background: #232428; border-bottom: 1px solid #303238">
    <div style="width: 30px; height: 30px; border-radius: 8px; background: #3d7bff; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="10" height="10" rx="2" fill="none" stroke="#ffffff" stroke-width="2"></rect><rect x="10.5" y="10.5" width="10" height="10" rx="2" fill="#ffffff"></rect></svg>
    </div>
    <span style="font-weight: 700; font-size: 16px; letter-spacing: 0.04em">組木</span>
    <span style="width: 1px; height: 18px; background: #3a3c42"></span>
    <span style="color: #a3a7b0">ホーム画面.ui</span>

    <div style="position: absolute; left: 50%; top: 0; height: 60px; transform: translateX(-50%); display: flex; align-items: center; gap: 22px">
      <div style="display: flex; align-items: center; gap: 10px">
        <span style="width: 12px; height: 12px; border-radius: 3px; background: #f2b23a"></span>
        <span style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 22px; color: #ffffff">12,480</span>
        <span style="color: #8fd6ad; font-size: 13px">毎秒 +86</span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px">
        <svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l8.66 5v10L12 22l-8.66-5V7z" fill="#b39cff"></path></svg>
        <span style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 18px; color: #ffffff">3</span>
      </div>
    </div>

    <span style="flex: 1"></span>
    <button type="button" style="display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 14px 0 10px; background: #26303f; border: 1px solid #3a4a66; border-radius: 19px; color: #e6e7ea; font: inherit">
      <svg width="22" height="22" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="14" fill="none" stroke="#3a4a66" stroke-width="5"></circle><circle cx="18" cy="18" r="14" fill="none" stroke="#8fb3ff" stroke-width="5" stroke-dasharray="35.2 88" stroke-linecap="round" transform="rotate(-90 18 18)"></circle></svg>
      <span>v1.0 リリースまで</span>
      <span style="font-family: 'JetBrains Mono', monospace; font-weight: 700; color: #8fb3ff">2 / 5</span>
    </button>
    <button type="button" style="display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px 0 16px; background: #3d7bff; border: 0; border-radius: 8px; color: #ffffff; font: inherit; font-weight: 700">書き出す<span style="display: inline-flex; align-items: center; gap: 4px; background: rgba(255,255,255,0.2); padding: 1px 8px; border-radius: 10px; font-weight: 500; font-size: 12.5px"><svg width="10" height="10" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l8.66 5v10L12 22l-8.66-5V7z" fill="#ffffff"></path></svg>+1</span></button>
  </header>

  <div style="flex: 1; display: flex; min-height: 0">

    <!-- 道具（持っているものだけ） -->
    <aside style="width: 68px; flex: none; background: #232428; border-right: 1px solid #303238; display: flex; flex-direction: column; align-items: center; gap: 8px; padding-top: 16px">
      <button type="button" aria-label="選択" style="width: 44px; height: 44px; border-radius: 10px; border: 0; background: none; color: #c9ccd3; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M5 3.5l13 6.8-5.8 1.7L10.4 18z"></path></svg></button>
      <button type="button" aria-label="四角" style="width: 44px; height: 44px; border-radius: 10px; border: 0; background: none; color: #c9ccd3; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"></rect></svg></button>
      <button type="button" aria-label="文字" style="width: 44px; height: 44px; border-radius: 10px; border: 0; background: none; color: #c9ccd3; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 5h14M12 5v14M9 19h6"></path></svg></button>
      <button type="button" aria-label="ドット鉛筆" style="width: 44px; height: 44px; border-radius: 10px; border: 0; background: #3a3220; color: #f7c45a; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 0 1px #6b5420"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M7 17l1-4 9-9 3 3-9 9z"></path><rect x="3" y="18" width="3.4" height="3.4" fill="currentColor" stroke="none"></rect></svg></button>
      <button type="button" aria-label="次の道具（塗りつぶし・6,500ピクセル）" style="width: 44px; height: 44px; border-radius: 10px; border: 1.5px dashed #3d4048; background: none; color: #6f737d; display: flex; align-items: center; justify-content: center; box-sizing: border-box"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
    </aside>

    <!-- 部品（作ったもの・次に作れるもの） -->
    <aside style="width: 300px; flex: none; background: #232428; border-right: 1px solid #303238; display: flex; flex-direction: column; min-height: 0">
      <div style="padding: 20px 20px 10px; font-weight: 700; font-size: 15px">部品</div>
      <div style="padding: 0 12px; display: flex; flex-direction: column; gap: 4px">
        <div style="display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 10px">
          <div style="width: 44px; height: 30px; border-radius: 7px; background: #3d7bff"></div>
          <span style="flex: 1">ボタン</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3fbf7f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 10px">
          <div style="width: 44px; height: 30px; border-radius: 7px; border: 1.5px solid #8b8f99; box-sizing: border-box"></div>
          <span style="flex: 1">入力欄</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3fbf7f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
        </div>
      </div>

      <div style="padding: 22px 20px 10px; color: #a3a7b0; font-size: 13px">次に作れる</div>
      <div style="padding: 0 12px; display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 10px; background: #2a2c31">
          <div style="width: 44px; height: 30px; display: flex; align-items: center"><div style="flex: 1; height: 4px; border-radius: 2px; background: #8b8f99; position: relative"><div style="position: absolute; left: 16px; top: -5px; width: 14px; height: 14px; border-radius: 50%; background: #e6e7ea"></div></div></div>
          <span style="flex: 1">スライダー</span>
          <button type="button" style="display: inline-flex; align-items: center; gap: 6px; background: #3d7bff; border: 0; color: #ffffff; font: inherit; font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 8px"><span style="width: 8px; height: 8px; border-radius: 2px; background: #f2b23a"></span>1,800</button>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 10px">
          <div style="width: 44px; height: 30px; display: flex; align-items: center"><div style="width: 36px; height: 20px; border-radius: 10px; background: #4a4d55; position: relative"><div style="position: absolute; left: 3px; top: 3px; width: 14px; height: 14px; border-radius: 50%; background: #e6e7ea"></div></div></div>
          <span style="flex: 1">スイッチ</span>
          <button type="button" style="display: inline-flex; align-items: center; gap: 6px; background: #2e3036; border: 1px solid #3d4048; color: #e6e7ea; font: inherit; font-size: 13px; font-weight: 500; padding: 5px 12px; border-radius: 8px"><span style="width: 8px; height: 8px; border-radius: 2px; background: #f2b23a"></span>4,200</button>
        </div>
      </div>

      <div style="flex: 1"></div>

      <div style="margin: 0 16px 18px; padding: 16px; border-radius: 12px; background: #1f2737; border: 1px solid #33456d">
        <div style="font-weight: 700; font-size: 15px">デスクトップとして組み立てる</div>
        <div style="color: #b4bccc; font-size: 13px; margin-top: 4px">作った部品で、動く画面をつくります</div>
        <div style="height: 8px; border-radius: 4px; background: #2b3550; margin-top: 14px; overflow: hidden"><div style="width: 5%; height: 8px; background: #8fb3ff"></div></div>
        <div style="text-align: right; margin-top: 6px; font-size: 13px; color: #b4bccc">25万 ピクセル</div>
      </div>
    </aside>

    <!-- キャンバス -->
    <main style="flex: 1; position: relative; background-color: #18191c; background-image: radial-gradient(circle, #26282d 1px, transparent 1.2px); background-size: 22px 22px; overflow: hidden">

      <!-- ホーム画面 -->
      <div style="position: absolute; left: 48px; top: 44px; color: #a3a7b0; font-size: 13px">ホーム画面</div>
      <div style="position: absolute; left: 48px; top: 70px; width: 720px; height: 460px; background: #eef1f5; box-shadow: 0 0 0 1px rgba(0,0,0,0.25), 0 14px 36px rgba(0,0,0,0.38); color: #14161b; overflow: hidden">
        <div style="height: 52px; background: #ffffff; border-bottom: 1px solid #e1e5eb; display: flex; align-items: center; gap: 10px; padding: 0 22px">
          <svg width="22" height="22" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true"><rect x="1" y="1" width="4" height="1" fill="#3b2a14"></rect><rect x="0" y="2" width="1" height="1" fill="#3b2a14"></rect><rect x="1" y="2" width="4" height="1" fill="#f2b23a"></rect><rect x="5" y="2" width="1" height="1" fill="#3b2a14"></rect><rect x="0" y="3" width="1" height="1" fill="#3b2a14"></rect><rect x="1" y="3" width="4" height="1" fill="#f2b23a"></rect><rect x="5" y="3" width="9" height="1" fill="#3b2a14"></rect><rect x="0" y="4" width="1" height="1" fill="#3b2a14"></rect><rect x="1" y="4" width="2" height="1" fill="#f2b23a"></rect><rect x="3" y="4" width="10" height="1" fill="#f3efe6"></rect><rect x="13" y="4" width="1" height="1" fill="#f2b23a"></rect><rect x="14" y="4" width="1" height="1" fill="#3b2a14"></rect><rect x="0" y="5" width="1" height="1" fill="#3b2a14"></rect><rect x="1" y="5" width="2" height="1" fill="#f2b23a"></rect><rect x="3" y="5" width="1" height="1" fill="#f3efe6"></rect><rect x="4" y="5" width="8" height="1" fill="#9aa7b4"></rect><rect x="12" y="5" width="1" height="1" fill="#f3efe6"></rect><rect x="13" y="5" width="1" height="1" fill="#f2b23a"></rect><rect x="14" y="5" width="1" height="1" fill="#3b2a14"></rect><rect x="0" y="6" width="1" height="1" fill="#3b2a14"></rect><rect x="1" y="6" width="2" height="1" fill="#f2b23a"></rect><rect x="3" y="6" width="10" height="1" fill="#f3efe6"></rect><rect x="13" y="6" width="1" height="1" fill="#f2b23a"></rect><rect x="14" y="6" width="1" height="1" fill="#3b2a14"></rect><rect x="0" y="7" width="16" height="1" fill="#3b2a14"></rect><rect x="0" y="8" width="1" height="1" fill="#3b2a14"></rect><rect x="1" y="8" width="14" height="1" fill="#ffd877"></rect><rect x="15" y="8" width="1" height="1" fill="#3b2a14"></rect><rect x="0" y="9" width="1" height="1" fill="#3b2a14"></rect><rect x="1" y="9" width="1" height="1" fill="#ffd877"></rect><rect x="2" y="9" width="12" height="1" fill="#f2b23a"></rect><rect x="14" y="9" width="1" height="1" fill="#c98418"></rect><rect x="15" y="9" width="1" height="1" fill="#3b2a14"></rect><rect x="0" y="10" width="1" height="1" fill="#3b2a14"></rect><rect x="1" y="10" width="13" height="1" fill="#f2b23a"></rect><rect x="14" y="10" width="1" height="1" fill="#c98418"></rect><rect x="15" y="10" width="1" height="1" fill="#3b2a14"></rect><rect x="0" y="11" width="1" height="1" fill="#3b2a14"></rect><rect x="1" y="11" width="13" height="1" fill="#f2b23a"></rect><rect x="14" y="11" width="1" height="1" fill="#c98418"></rect><rect x="15" y="11" width="1" height="1" fill="#3b2a14"></rect><rect x="0" y="12" width="1" height="1" fill="#3b2a14"></rect><rect x="1" y="12" width="13" height="1" fill="#f2b23a"></rect><rect x="14" y="12" width="1" height="1" fill="#c98418"></rect><rect x="15" y="12" width="1" height="1" fill="#3b2a14"></rect><rect x="0" y="13" width="1" height="1" fill="#3b2a14"></rect><rect x="1" y="13" width="14" height="1" fill="#c98418"></rect><rect x="15" y="13" width="1" height="1" fill="#3b2a14"></rect><rect x="0" y="14" width="16" height="1" fill="#3b2a14"></rect></svg>
          <span style="font-weight: 700; font-size: 16px">ホーム</span>
        </div>
        <div style="position: absolute; left: 160px; top: 100px; width: 400px; height: 300px; background: #ffffff; border-radius: 14px; box-shadow: 0 1px 2px rgba(16,24,40,0.06), 0 8px 24px rgba(16,24,40,0.08)">
          <div style="position: absolute; left: 32px; top: 30px; font-size: 14px; color: #586070">所持ピクセル</div>
          <div style="position: absolute; left: 32px; top: 52px; font-size: 44px; line-height: 52px; font-weight: 700; letter-spacing: -0.01em">12,480</div>
          <div style="position: absolute; left: 32px; top: 108px; font-size: 13px; color: #1d7a50; font-weight: 500">毎秒 +86</div>
          <div style="position: absolute; left: 32px; top: 152px; width: 336px; height: 48px; border-radius: 8px; background: #3d7bff; color: #ffffff; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(61,123,255,0.30)">ピクセルを生成</div>
          <div style="position: absolute; left: 32px; top: 234px; width: 336px; display: flex; justify-content: space-between; font-size: 12.5px; color: #586070"><span>自動生成</span><span>次まで 3.2秒</span></div>
          <div style="position: absolute; left: 32px; top: 256px; width: 336px; height: 8px; border-radius: 4px; background: #e6ebf3; overflow: hidden"><div style="width: 62%; height: 8px; background: #3d7bff"></div></div>
          <div style="position: absolute; left: 30px; top: 150px; width: 338px; height: 50px; border: 2px solid #4c8dff; border-radius: 9px; box-sizing: border-box"></div>
          <div style="position: absolute; left: 26px; top: 146px; width: 9px; height: 9px; background: #ffffff; border: 2px solid #4c8dff; box-sizing: border-box"></div>
          <div style="position: absolute; left: 364px; top: 146px; width: 9px; height: 9px; background: #ffffff; border: 2px solid #4c8dff; box-sizing: border-box"></div>
          <div style="position: absolute; left: 26px; top: 195px; width: 9px; height: 9px; background: #ffffff; border: 2px solid #4c8dff; box-sizing: border-box"></div>
          <div style="position: absolute; left: 364px; top: 195px; width: 9px; height: 9px; background: #ffffff; border: 2px solid #4c8dff; box-sizing: border-box"></div>
        </div>
      </div>

      <!-- アイコン（ドットを置く場所） -->
      <div style="position: absolute; left: 820px; top: 44px; width: 364px; display: flex; justify-content: space-between; color: #a3a7b0; font-size: 13px"><span>アイコン「フォルダ」</span><span><span style="color: #f2b23a; font-weight: 700">142</span> / 256</span></div>
      <div style="position: absolute; left: 820px; top: 70px; width: 364px; height: 414px; background: #26282c; border-radius: 4px; box-shadow: 0 0 0 1px #383a41, 0 14px 36px rgba(0,0,0,0.38); box-sizing: border-box; padding: 22px">
        <div style="position: relative; width: 320px; height: 320px">
          <svg width="320" height="320" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true" style="display: block; background: #e9ecf1">
            <rect x="1" y="1" width="4" height="1" fill="#3b2a14"></rect><rect x="0" y="2" width="1" height="1" fill="#3b2a14"></rect><rect x="1" y="2" width="4" height="1" fill="#f2b23a"></rect><rect x="5" y="2" width="1" height="1" fill="#3b2a14"></rect><rect x="0" y="3" width="1" height="1" fill="#3b2a14"></rect><rect x="1" y="3" width="4" height="1" fill="#f2b23a"></rect><rect x="5" y="3" width="9" height="1" fill="#3b2a14"></rect><rect x="0" y="4" width="1" height="1" fill="#3b2a14"></rect><rect x="1" y="4" width="2" height="1" fill="#f2b23a"></rect><rect x="3" y="4" width="10" height="1" fill="#f3efe6"></rect><rect x="13" y="4" width="1" height="1" fill="#f2b23a"></rect><rect x="14" y="4" width="1" height="1" fill="#3b2a14"></rect><rect x="0" y="5" width="1" height="1" fill="#3b2a14"></rect><rect x="1" y="5" width="2" height="1" fill="#f2b23a"></rect><rect x="3" y="5" width="1" height="1" fill="#f3efe6"></rect><rect x="4" y="5" width="8" height="1" fill="#9aa7b4"></rect><rect x="12" y="5" width="1" height="1" fill="#f3efe6"></rect><rect x="13" y="5" width="1" height="1" fill="#f2b23a"></rect><rect x="14" y="5" width="1" height="1" fill="#3b2a14"></rect><rect x="0" y="6" width="1" height="1" fill="#3b2a14"></rect><rect x="1" y="6" width="2" height="1" fill="#f2b23a"></rect><rect x="3" y="6" width="10" height="1" fill="#f3efe6"></rect><rect x="13" y="6" width="1" height="1" fill="#f2b23a"></rect><rect x="14" y="6" width="1" height="1" fill="#3b2a14"></rect><rect x="0" y="7" width="16" height="1" fill="#3b2a14"></rect><rect x="0" y="8" width="1" height="1" fill="#3b2a14"></rect><rect x="1" y="8" width="14" height="1" fill="#ffd877"></rect><rect x="15" y="8" width="1" height="1" fill="#3b2a14"></rect><rect x="0" y="9" width="1" height="1" fill="#3b2a14"></rect><rect x="1" y="9" width="1" height="1" fill="#ffd877"></rect><rect x="2" y="9" width="12" height="1" fill="#f2b23a"></rect><rect x="14" y="9" width="1" height="1" fill="#c98418"></rect><rect x="15" y="9" width="1" height="1" fill="#3b2a14"></rect><rect x="0" y="10" width="1" height="1" fill="#3b2a14"></rect><rect x="1" y="10" width="13" height="1" fill="#f2b23a"></rect><rect x="14" y="10" width="1" height="1" fill="#c98418"></rect><rect x="15" y="10" width="1" height="1" fill="#3b2a14"></rect><rect x="0" y="11" width="1" height="1" fill="#3b2a14"></rect><rect x="1" y="11" width="8" height="1" fill="#f2b23a"></rect>
            <g stroke="#cdd2da" stroke-width="0.045" shape-rendering="auto"><path d="M1 0V16M2 0V16M3 0V16M4 0V16M5 0V16M6 0V16M7 0V16M8 0V16M9 0V16M10 0V16M11 0V16M12 0V16M13 0V16M14 0V16M15 0V16M0 1H16M0 2H16M0 3H16M0 4H16M0 5H16M0 6H16M0 7H16M0 8H16M0 9H16M0 10H16M0 11H16M0 12H16M0 13H16M0 14H16M0 15H16"></path></g>
            <rect x="9" y="11" width="1" height="1" fill="rgba(242,178,58,0.45)" stroke="#14161b" stroke-width="0.09" shape-rendering="auto"></rect>
          </svg>
          <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" style="position: absolute; left: 204px; top: 226px"><path d="M4 20l1.2-4.6L16 4.6l3.4 3.4L8.6 18.8z" fill="#14161b" stroke="#ffffff" stroke-width="1.4" stroke-linejoin="round"></path></svg>
          <div style="position: absolute; left: 214px; top: 262px; white-space: nowrap; background: #14161b; color: #f7cf7a; font-weight: 700; font-size: 13px; padding: 3px 10px; border-radius: 12px">+1 ピクセル</div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; margin-top: 18px">
