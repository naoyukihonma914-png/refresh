<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>見本：素の画面 ③（今のウェブ風）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>body{margin:0}</style>
<style>html,body{background:#0e0f11} #stage{transform-origin:0 0;width:1920px;height:1080px}</style>
</head>
<body>
<!-- 見本（静止画）。1920×1080で設計。画面が狭いときは縮小して表示する -->
<!-- 場面：②と同じ。素の画面の段の③：今のウェブ風 -->
<!-- 見た目：上に細い見出しの帯（製品名・更新履歴・このページの設定・言語）、ゴシック体、目標を大きな見出しに、細い進み具合の線、左に色の線のお知らせ、黒い平らなボタン、線で区切った一覧。色は強調色1つと灰色 -->
<!-- 進化の段：①90年代の素のHTML（見本01）→ ②2000年代のホームページ風 → ③これ -->
<div id="frame"><div id="stage">
<div style="width:1920px;height:1080px;overflow:hidden;background:#fbfaf8;font-family:'Noto Sans JP',sans-serif;color:#16181b">
<div style="height:64px;border-bottom:1px solid #e8e6e1;display:flex;align-items:center;padding:0 calc((1920px - 1040px)/2)">
 <b style="font-size:16px">無題 v1</b><span style="margin-left:auto;display:flex;gap:28px;font-size:14px;color:#4a4f57"><span>更新履歴</span><span>このページの設定</span><span>日本語 ⌄</span></span></div>
<div style="width:1040px;margin:0 auto;padding-top:64px">
 <div style="font-size:14px;color:#6b7078">目標</div>
 <div style="font-size:34px;font-weight:700;letter-spacing:-.5px;margin-top:6px">この画面を作り上げて、v1.0 としてリリースする。</div>
 <div style="display:flex;align-items:center;gap:12px;margin-top:16px;color:#6b7078;font-size:14px"><span style="width:240px;height:4px;background:#e8e6e1;border-radius:2px"><span style="display:block;width:0;height:4px"></span></span>0 / 5</div>
 <div style="margin-top:40px;padding:16px 20px;border-left:3px solid #0f6b5f;background:#f1f5f3;font-size:15px;line-height:1.8">お客さんから「動きがあると楽しい」という声が届いています。アニメーションまでそろいましたね。次は Tessera を作って、この画面を部品から組み立てられるようにしましょう。<div style="margin-top:6px;color:#6b7078;font-size:13px">余白社 榎本　·　<u>閉じる</u></div></div>
 <div style="margin-top:48px;display:flex;align-items:baseline;gap:16px"><span style="font-size:15px;color:#6b7078">ピクセル</span><span style="font-size:30px;font-weight:700;font-variant-numeric:tabular-nums">836,240</span><span style="font-size:14px;color:#0f6b5f">毎秒 +24</span></div>
 <div style="position:relative;margin-top:20px;height:52px"><span style="height:48px;display:inline-flex;align-items:center;padding:0 26px;border-radius:6px;background:#16181b;color:#fff;font-size:15px">ピクセルを4個生成する</span><svg width="16" height="18" viewBox="0 0 18 20" style="position:absolute;left:210px;top:14px"><path d="M2 1.5l12.5 7.4-5.5 1.4-3 5.6z" fill="#fff" stroke="#111" stroke-width="1.3" stroke-linejoin="round"/></svg><svg width="16" height="18" viewBox="0 0 18 20" style="position:absolute;left:236px;top:18px"><path d="M2 1.5l12.5 7.4-5.5 1.4-3 5.6z" fill="#fff" stroke="#111" stroke-width="1.3" stroke-linejoin="round"/></svg><svg width="16" height="18" viewBox="0 0 18 20" style="position:absolute;left:262px;top:12px"><path d="M2 1.5l12.5 7.4-5.5 1.4-3 5.6z" fill="#fff" stroke="#111" stroke-width="1.3" stroke-linejoin="round"/></svg><svg width="16" height="18" viewBox="0 0 18 20" style="position:absolute;left:288px;top:16px"><path d="M2 1.5l12.5 7.4-5.5 1.4-3 5.6z" fill="#fff" stroke="#111" stroke-width="1.3" stroke-linejoin="round"/></svg><svg width="16" height="18" viewBox="0 0 18 20" style="position:absolute;left:314px;top:14px"><path d="M2 1.5l12.5 7.4-5.5 1.4-3 5.6z" fill="#fff" stroke="#111" stroke-width="1.3" stroke-linejoin="round"/></svg><svg width="16" height="18" viewBox="0 0 18 20" style="position:absolute;left:340px;top:18px"><path d="M2 1.5l12.5 7.4-5.5 1.4-3 5.6z" fill="#fff" stroke="#111" stroke-width="1.3" stroke-linejoin="round"/></svg></div>
 <div style="margin-top:56px;font-size:13px;color:#6b7078">アップグレード</div>
 <div style="margin-top:10px;border-top:1px solid #e8e6e1"><div style="height:60px;display:flex;align-items:center;border-bottom:1px solid #e8e6e1;font-size:15px"><span>オートカーソル</span><span style="margin-left:12px;font-size:13px;color:#0f6b5f">毎秒 +3</span><span style="margin-left:auto;height:36px;display:inline-flex;align-items:center;padding:0 16px;border-radius:6px;box-shadow:inset 0 0 0 1px #cfccc5;font-size:14px">46 で作る</span></div><div style="height:60px;display:flex;align-items:center;border-bottom:1px solid #e8e6e1;font-size:15px"><span>更新履歴の段落</span><span style="margin-left:12px;font-size:13px;color:#0f6b5f"></span><span style="margin-left:auto;height:36px;display:inline-flex;align-items:center;padding:0 16px;border-radius:6px;box-shadow:inset 0 0 0 1px #cfccc5;font-size:14px">2トークン で取る</span></div></div>
 <div style="margin-top:20px;font-size:13px;color:#9a9ea5">保存しました 19:56</div>
</div></div>
</div></div>
<script>
function fit(){var s=Math.min(1,window.innerWidth/1920);var st=document.getElementById('stage');st.style.transform='scale('+s+')';document.getElementById('frame').style.height=(1080*s)+'px';}
window.addEventListener('resize',fit);fit();
</script>
</body>
</html>
