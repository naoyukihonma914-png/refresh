# 見本はルート、ゲームは /play/ に公開する。
# 無料プランではリポジトリが公開（Public）のときだけ動く。非公開（Private）なら何もしない。
name: 見本とゲームを公開

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json
      - run: npm ci
        working-directory: game
      - run: npm test
        working-directory: game
      - run: npm run build
        working-directory: game
      - name: 見本とゲームを配置
        run: |
          mkdir -p "$RUNNER_TEMP/refresh-pages/play"
          cp -R docs/mockups/. "$RUNNER_TEMP/refresh-pages/"
          cp game/dist/index.html "$RUNNER_TEMP/refresh-pages/play/index.html"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/refresh-pages
      - id: deployment
        uses: actions/deploy-pages@v4
