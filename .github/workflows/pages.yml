# 見本（docs/mockups）を GitHub Pages に公開する。
# 無料プランではリポジトリが公開（Public）のときだけ動く。非公開（Private）なら何もしない。
name: 見本を公開

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/mockups
      - id: deployment
        uses: actions/deploy-pages@v4
